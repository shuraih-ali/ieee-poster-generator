name: ieee_poster_studio
description: Professional IEEE Student Chapter poster generator.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  gal: ^2.3.0
  share_plus: ^9.0.0
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  flutter_colorpicker: ^1.0.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
